name: jaroos
description: "JAROOS - An Interactive Educational App for Kids. Learn • Play • Grow."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animals/
    - assets/fruits/
    - assets/alphabets/
    - assets/numbers/
    - assets/stories/
    - assets/rhymes/
    - assets/audio/
